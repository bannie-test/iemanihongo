name: Build apps

on:
  push:
  workflow_dispatch:

permissions:
  contents: write  # to publish the APK and IPA as a GitHub release

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk iemanihongo-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: iemanihongo-apk
          path: iemanihongo-${{ github.run_number }}.apk

  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - run: flutter pub get

      # No Apple signing certificate is configured, so the app is built
      # unsigned. Sideloadly / AltStore sign it with the user's Apple ID
      # when installing.
      - name: Build release app (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry iemanihongo-${{ github.run_number }}.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: iemanihongo-ipa
          path: iemanihongo-${{ github.run_number }}.ipa

  release:
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Iemanihongo build ${{ github.run_number }} (${{ github.ref_name }})
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: |
            iemanihongo-${{ github.run_number }}.apk
            iemanihongo-${{ github.run_number }}.ipa
          body: |
            Built from `${{ github.sha }}` on `${{ github.ref_name }}`.

            **Android** — `iemanihongo-${{ github.run_number }}.apk`: download on the phone and open it
            (allow "Install unknown apps" when asked).

            **iPhone** — `iemanihongo-${{ github.run_number }}.ipa` (unsigned): install it from a computer with
            [Sideloadly](https://sideloadly.io) or [AltStore](https://altstore.io) using your Apple ID.
            Then on the iPhone: Settings → General → VPN & Device Management → trust your Apple ID,
            and turn on Developer Mode (Settings → Privacy & Security). With a free Apple ID the app
            must be re-installed every 7 days.
