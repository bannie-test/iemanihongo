name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write  # to publish the APK as a GitHub release

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk iemanihongo-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: iemanihongo-apk
          path: iemanihongo-${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Iemanihongo build ${{ github.run_number }} (${{ github.ref_name }})
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: iemanihongo-${{ github.run_number }}.apk
          body: |
            Android APK built from `${{ github.sha }}` on `${{ github.ref_name }}`.
            Download the .apk on your phone and open it to install (allow "Install unknown apps" when asked).
