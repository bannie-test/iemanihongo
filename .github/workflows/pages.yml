name: Deploy website to GitHub Pages

# Đưa thư mục website/ lên GitHub Pages mỗi khi nhánh mặc định có thay đổi trong website/.
# Cần bật một lần: Settings → Pages → Build and deployment → Source: GitHub Actions.

on:
  push:
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Chỉ triển khai từ nhánh mặc định (hoặc khi chạy tay).
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Check the site's scripts parse
        run: for f in website/*.js website/data/*.js; do node --check "$f"; done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - id: deployment
        uses: actions/deploy-pages@v4
